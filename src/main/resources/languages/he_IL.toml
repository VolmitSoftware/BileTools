# BileTools — he_IL
#
# === עריכת הקובץ ===
# plugins/BileTools/languages/he_IL.toml
# אפשר לערוך קובץ זה ישירות. שינויים מקומיים נשמרים; ערכים חסרים או לא תקינים משתמשים באנגלית המובנית.
# /biletools language server edit he_IL
#
# === קידומת ===
# הקידומת &a[&8Bile&a]: כתובה ישירות בכל הודעה; יש לערוך אותה בהודעות המתאימות.
#
# === עיצוב ===
# צבעים: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B וגם [RRGGBB]. ניתן להשתמש גם ב-MiniMessage לעיצוב מותאם.
#
# === משתנים ===
# יש לשמור על שמות המשתנים ולהשתמש רק במשתנים הקיימים בכל הודעה.
#   {after}  ערך לאחר השינוי
#   {argument}  ארגומנט לא צפוי
#   {before}  ערך לפני השינוי
#   {category}  קטגוריה
#   {command}  נתיב פקודה
#   {context}  הסיבה לטעינה מחדש של התוסף
#   {count}  מספר היעדים המרוחקים ובורר צורת הרבים; מספר ההודעות
#   {file}  שם קובץ ה-JAR של התוסף
#   {group}  קטגוריה
#   {host}  כתובת ה-IP של השולח
#   {installedVersion}  גרסת התוסף המותקנת כעת
#   {key}  מפתח הודעה או פרמטר
#   {latestVersion}  הגרסה האחרונה הזמינה בספרייה
#   {line}  מקור או קו מספר
#   {locale}  אזור שפה
#   {maximum}  ערך מותר מקסימלי
#   {milliseconds}  משך הטעינה, הפריקה או הטעינה מחדש במילישניות
#   {new}  הערך החדש
#   {old}  הערך הקודם
#   {parameter}  שם פרמטר
#   {permission}  ההרשאה הנדרשת
#   {personal}  אזור השפה האישי
#   {plugin}  שם Plugin
#   {reason}  סיבת כשל
#   {section}  מקטע בעורך השפות
#   {setting}  שם הגדרה
#   {target}  שם Plugin
#   {type}  סוג
#   {value}  ערך נוכחי, ברירת מחדל או גולמי
#   {variables}  מצייני מקום תקינים
#   {version}  גרסת תוסף הספרייה המבוקשת או המוצגת


# BileTools — he_IL
#
# === עריכת הקובץ ===
# plugins/BileTools/languages/he_IL.toml
# ערכו קובץ זה ישירות. שינויים מקומיים נשמרים; עבור ערכים חסרים או לא תקינים נעשה שימוש באנגלית המובנית.
# /biletools language server edit he_IL
#
# === קידומת ===
# הקידומת &a[&8Bile&a]: היא חלק מכל הודעת צ׳אט; ערכו אותה שם.
# אין הגדרה נפרדת לקידומת ואין משתנה לקידומת.
#
# === עיצוב ===
# צבעים וסגנונות: &0-&f, &k-&r.
# צבעי RGB: &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B, [RRGGBB].
# MiniMessage תומך בעיצוב מותאם אישית. כדי להציג & או [ כפשוטם, הוסיפו לפניהם לוכסן הפוך.
#
# === משתנים ===
# אל תשנו את שמות המשתנים, והשתמשו רק במשתנים השייכים לכל הודעה.
#   {added}  הודעות שנוספו בעדכון שפה
#   {after}  ערך ההודעה לאחר העריכה
#   {argument}  ארגומנט פקודה לא צפוי
#   {before}  ערך ההודעה לפני העריכה
#   {capability}  זמינות יכולות הפירוק הנדרשות
#   {category}  קטגוריה בעורך ההגדרות
#   {command}  נתיב הפקודה או הפקודה שנשלחה
#   {context}  הסיבה או הגורם לטעינה מחדש של התוסף
#   {cooperative}  האם התוסף תומך בטעינה מחדש שיתופית
#   {count}  מספר יעדי הפריסה המרוחקת שהוגדרו ובורר צורת הרבים
#   {dependents}  התוספים הכלולים בקבוצת הטעינה מחדש
#   {enabled}  האם התוסף הנבדק פעיל
#   {file}  שם קובץ ה-JAR של התוסף
#   {group}  קבוצת הודעות בעורך השפות
#   {host}  כתובת ה-IP של השולח הנכנס
#   {installedVersion}  גרסת התוסף המותקנת כעת
#   {kept}  עריכות מקומיות שנשמרו בעדכון שפה
#   {key}  מפתח פרמטר הפקודה או מפתח ההודעה
#   {latestVersion}  הגרסה האחרונה הזמינה בספרייה
#   {line}  מספר שורה בתוך הודעת רשימה
#   {locale}  מזהה קוד השפה
#   {maximum}  אורך הקלט המרבי בעורך
#   {milliseconds}  משך הטעינה, הפריקה או הטעינה מחדש במילישניות
#   {new}  הערך החדש של ההגדרה או ההודעה
#   {old}  הערך הקודם של ההגדרה או ההודעה
#   {parameter}  שם פרמטר הפקודה
#   {permission}  ההרשאה הנדרשת
#   {personal}  קוד השפה האישי, אם הוא שונה מברירת המחדל של השרת
#   {plugin}  שם התוסף
#   {reason}  סיבת הכשל
#   {recovery}  האם קיים קובץ JAR לשחזור הגרסה הפועלת
#   {remaining}  הזמן שנותר עד שתותר בדיקת השפות הבאה
#   {section}  מקטע בעורך השפות
#   {setting}  שם ההגדרה או מפתח ההודעה
#   {target}  יעד בחירת השפה
#   {type}  סוג פרמטר הפקודה
#   {updated}  הודעות ששונו בעדכון שפה
#   {value}  ערך נוכחי, ברירת מחדל או ערך שהוזן
#   {variables}  שמות המשתנים הנדרשים להודעה
#   {version}  גרסת תוסף הספרייה המבוקשת או המוצגת


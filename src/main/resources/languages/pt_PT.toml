# BileTools — pt_PT
#
# === Edição do ficheiro ===
# plugins/BileTools/languages/pt_PT.toml
# Edita este ficheiro diretamente. As alterações locais são mantidas; as entradas em falta ou inválidas usam o inglês incorporado.
# /biletools language server edit pt_PT
#
# === Prefixo ===
# O prefixo &a[&8Bile&a]: faz parte de cada mensagem do chat; edita-o aí.
# Não existe uma definição de prefixo separada nem uma variável de prefixo.
#
# === Formatação ===
# Cores e estilos: &0-&f, &k-&r.
# Cores RGB: &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B, [RRGGBB].
# O MiniMessage suporta formatação personalizada. Coloca uma barra invertida antes de & ou [ para os mostrar literalmente.
#
# === Variáveis ===
# Mantém os nomes das variáveis inalterados e usa apenas as variáveis de cada mensagem.
#   {added}  Mensagens adicionadas por uma atualização de idioma
#   {after}  Valor da mensagem após a edição
#   {argument}  Argumento de comando inesperado
#   {before}  Valor da mensagem antes da edição
#   {capability}  Disponibilidade das capacidades de desmontagem necessárias
#   {category}  Categoria do editor de configuração
#   {command}  Caminho do comando ou comando enviado
#   {context}  Motivo ou causa do recarregamento de um plugin
#   {cooperative}  Se o plugin implementa o recarregamento cooperativo
#   {count}  Número de destinos de implementação remota configurados e seletor do plural
#   {dependents}  Plugins incluídos no grupo de recarregamento
#   {enabled}  Se o plugin inspecionado está ativado
#   {file}  Nome do ficheiro JAR do plugin
#   {group}  Grupo de mensagens do editor de idiomas
#   {host}  Endereço IP do emissor da ligação recebida
#   {installedVersion}  Versão do plugin atualmente instalada
#   {kept}  Edições locais mantidas por uma atualização de idioma
#   {key}  Chave do parâmetro do comando ou da mensagem
#   {latestVersion}  Última versão disponível na biblioteca
#   {line}  Número de linha numa mensagem de lista
#   {locale}  Identificador do código de idioma
#   {maximum}  Comprimento máximo do texto introduzido no editor
#   {milliseconds}  Duração do carregamento, descarregamento ou recarregamento em milissegundos
#   {new}  Novo valor da definição ou da mensagem
#   {old}  Valor anterior da definição ou da mensagem
#   {parameter}  Nome do parâmetro do comando
#   {permission}  Nó de permissão necessário
#   {personal}  Código de idioma pessoal, quando difere do predefinido do servidor
#   {plugin}  Nome do plugin
#   {reason}  Motivo da falha
#   {recovery}  Se existe um JAR de recuperação da versão em execução
#   {remaining}  Tempo até ser permitida a próxima verificação de idiomas
#   {section}  Secção do editor de idiomas
#   {setting}  Nome da definição ou chave da mensagem
#   {target}  Destino da escolha de idioma
#   {type}  Tipo do parâmetro do comando
#   {updated}  Mensagens alteradas por uma atualização de idioma
#   {value}  Valor atual, predefinido ou enviado
#   {variables}  Nomes das variáveis necessárias da mensagem
#   {version}  Versão pedida ou listada do plugin da biblioteca


# BileTools — pt_PT
#
# === Editar o ficheiro ===
# plugins/BileTools/languages/pt_PT.toml
# Pode editar este ficheiro diretamente. As alterações locais são preservadas; as entradas em falta ou inválidas usam o inglês incorporado.
# /biletools language server edit pt_PT
#
# === Prefixo ===
# O prefixo &a[&8Bile&a]: está escrito diretamente em cada mensagem; edita-o nas mensagens correspondentes.
#
# === Formatação ===
# Cores: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B e [RRGGBB]. O MiniMessage continua disponível para formatação personalizada.
#
# === Variáveis ===
# Mantenha os nomes das variáveis e use apenas as que pertencem a cada mensagem.
#   {after}  Valor após a alteração
#   {argument}  argumento inesperado
#   {before}  Valor antes da alteração
#   {category}  categoria
#   {command}  caminho do comando
#   {context}  Motivo do recarregamento do plugin
#   {count}  Número de destinos remotos e seletor do plural; Número de mensagens
#   {file}  Nome do ficheiro JAR do plugin
#   {group}  categoria
#   {host}  Endereço IP do remetente
#   {installedVersion}  Versão do plugin atualmente instalada
#   {key}  Chave da mensagem ou do parâmetro
#   {latestVersion}  Última versão disponível na biblioteca
#   {line}  Linha de origem ou número de linha
#   {locale}  região
#   {maximum}  Valor máximo autorizado
#   {milliseconds}  Duração do carregamento, descarregamento ou recarregamento em milissegundos
#   {new}  valor novo
#   {old}  valor anterior
#   {parameter}  nome do parâmetro
#   {permission}  Permissão necessária
#   {personal}  região pessoal
#   {plugin}  Nome do plug-in
#   {reason}  motivo da falha
#   {section}  Secção do editor de idiomas
#   {setting}  nome da definição
#   {target}  Nome do plug-in
#   {type}  tipo
#   {value}  valor atual, predefinido ou bruto
#   {variables}  marcadores válidos
#   {version}  Versão pedida ou apresentada do plugin da biblioteca


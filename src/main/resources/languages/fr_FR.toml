# BileTools — fr_FR
#
# === Modification du fichier ===
# plugins/BileTools/languages/fr_FR.toml
# Modifiez directement ce fichier. Les modifications locales sont conservées ; les entrées manquantes ou invalides utilisent l’anglais intégré.
# /biletools language server edit fr_FR
#
# === Préfixe ===
# Le préfixe &a[&8Bile&a]: fait partie de chaque message du chat ; modifiez-le à cet endroit.
# Il n’existe aucun réglage ni aucune variable distincte pour le préfixe.
#
# === Mise en forme ===
# Couleurs et styles : &0-&f, &k-&r.
# Couleurs RVB : &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B, [RRGGBB].
# MiniMessage permet une mise en forme personnalisée. Placez une barre oblique inverse devant & ou [ pour l’afficher tel quel.
#
# === Variables ===
# Conservez les noms des variables et utilisez uniquement les variables propres à chaque message.
#   {added}  Messages ajoutés par une mise à jour des langues
#   {after}  Valeur du message après la modification
#   {argument}  Argument de commande inattendu
#   {before}  Valeur du message avant la modification
#   {capability}  Disponibilité des capacités de nettoyage requises
#   {category}  Catégorie de l’éditeur de configuration
#   {command}  Chemin de la commande ou commande envoyée
#   {context}  Motif ou déclencheur du rechargement d’un plugin
#   {cooperative}  Indique si le plugin implémente le rechargement coopératif
#   {count}  Nombre configuré de cibles du déploiement distant et sélecteur de pluriel
#   {dependents}  Plugins inclus dans le groupe de rechargement
#   {enabled}  Indique si le plugin inspecté est activé
#   {file}  Nom du fichier JAR du plugin
#   {group}  Groupe de messages de l’éditeur de langues
#   {host}  Adresse IP de l’expéditeur entrant
#   {installedVersion}  Version du plugin actuellement installée
#   {kept}  Modifications locales conservées par une mise à jour des langues
#   {key}  Clé de paramètre de commande ou de message
#   {latestVersion}  Dernière version disponible dans la bibliothèque
#   {line}  Numéro de ligne dans un message de type liste
#   {locale}  Code de langue
#   {maximum}  Longueur maximale d’une saisie dans l’éditeur
#   {milliseconds}  Durée du chargement, du déchargement ou du rechargement en millisecondes
#   {new}  Nouvelle valeur du réglage ou du message
#   {old}  Valeur précédente du réglage ou du message
#   {parameter}  Nom du paramètre de commande
#   {permission}  Nœud de permission requis
#   {personal}  Code de langue personnel, s’il diffère de la langue par défaut du serveur
#   {plugin}  Nom du plugin
#   {reason}  Motif de l’échec
#   {recovery}  Indique si un fichier JAR de récupération de la version en cours est disponible
#   {remaining}  Délai avant la prochaine vérification des langues autorisée
#   {section}  Section de l’éditeur de langues
#   {setting}  Nom du réglage ou clé du message
#   {target}  Cible de la sélection de langue
#   {type}  Type du paramètre de commande
#   {updated}  Messages modifiés par une mise à jour des langues
#   {value}  Valeur actuelle, par défaut ou saisie
#   {variables}  Noms des variables requises par le message
#   {version}  Version demandée ou listée d’un plugin de la bibliothèque


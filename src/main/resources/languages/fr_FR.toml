# BileTools — fr_FR
#
# === Modifier le fichier ===
# plugins/BileTools/languages/fr_FR.toml
# Ce fichier peut être modifié directement. Les modifications locales sont conservées ; les entrées manquantes ou invalides utilisent l’anglais intégré.
# /biletools language server edit fr_FR
#
# === Préfixe ===
# Le préfixe &a[&8Bile&a]: est écrit directement dans chaque message ; modifiez-le dans les messages concernés.
#
# === Mise en forme ===
# Couleurs : &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B et [RRGGBB]. MiniMessage reste disponible pour les formats personnalisés.
#
# === Variables ===
# Conservez les noms des variables et utilisez uniquement celles du message concerné.
#   {after}  Valeur après le changement
#   {argument}  argument inattendu
#   {before}  Valeur avant la variation
#   {category}  catégorie
#   {command}  chemin de commande
#   {context}  Motif du rechargement du plugin
#   {count}  Nombre de cibles distantes et sélecteur du pluriel; Nombre de messages
#   {file}  Nom du fichier JAR du plugin
#   {group}  catégorie
#   {host}  Adresse IP de l’expéditeur
#   {installedVersion}  Version du plugin actuellement installée
#   {key}  Clé de message ou de paramètre
#   {latestVersion}  Dernière version disponible dans la bibliothèque
#   {line}  Ligne source ou numéro de ligne
#   {locale}  code régional
#   {maximum}  Valeur maximale autorisée
#   {milliseconds}  Durée du chargement, déchargement ou rechargement en millisecondes
#   {new}  nouvelle valeur
#   {old}  ancienne valeur
#   {parameter}  nom du paramètre
#   {permission}  Permission requise
#   {personal}  code régional personnel
#   {plugin}  Nom du greffon
#   {reason}  motif de l’échec
#   {setting}  nom du réglage
#   {target}  Nom du greffon
#   {type}  type
#   {usage}  syntaxe de commande
#   {value}  valeur actuelle, par défaut ou brute
#   {variables}  variables valides
#   {version}  Version demandée ou affichée du plugin de la bibliothèque


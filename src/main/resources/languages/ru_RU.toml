# BileTools — ru_RU
#
# === Редактирование файла ===
# plugins/BileTools/languages/ru_RU.toml
# Редактируйте этот файл напрямую. Локальные изменения сохраняются; для отсутствующих или неверных записей используется встроенный английский текст.
# /biletools language server edit ru_RU
#
# === Префикс ===
# Префикс &a[&8Bile&a]: входит в каждое сообщение чата; меняйте его там.
# Отдельной настройки префикса или переменной префикса нет.
#
# === Форматирование ===
# Цвета и стили: &0-&f, &k-&r.
# RGB-цвета: &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B, [RRGGBB].
# MiniMessage поддерживает собственное форматирование. Чтобы вывести & или [ как обычный символ, поставьте перед ним обратную косую черту.
#
# === Переменные ===
# Не меняйте имена переменных и используйте только переменные, относящиеся к каждому сообщению.
#   {added}  Сообщения, добавленные обновлением языка
#   {after}  Значение сообщения после изменения
#   {argument}  Неожиданный аргумент команды
#   {before}  Значение сообщения до изменения
#   {capability}  Доступность необходимых средств очистки при выгрузке
#   {category}  Категория редактора настроек
#   {command}  Путь команды или отправленная команда
#   {context}  Причина или источник перезагрузки плагина
#   {cooperative}  Поддерживает ли плагин кооперативную перезагрузку
#   {count}  Число целевых серверов удалённого развёртывания и выбор формы множественного числа
#   {dependents}  Плагины, входящие в группу перезагрузки
#   {enabled}  Включён ли проверяемый плагин
#   {file}  Имя JAR-файла плагина
#   {group}  Группа сообщений в редакторе языков
#   {host}  IP-адрес входящего отправителя
#   {installedVersion}  Установленная сейчас версия плагина
#   {kept}  Локальные правки, сохранённые при обновлении языка
#   {key}  Ключ параметра команды или сообщения
#   {latestVersion}  Последняя доступная версия в библиотеке
#   {line}  Номер строки в сообщении-списке
#   {locale}  Идентификатор локали
#   {maximum}  Максимальная длина ввода в редакторе
#   {milliseconds}  Длительность загрузки, выгрузки или перезагрузки в миллисекундах
#   {new}  Новое значение настройки или сообщения
#   {old}  Предыдущее значение настройки или сообщения
#   {parameter}  Имя параметра команды
#   {permission}  Необходимое право доступа
#   {personal}  Личная локаль, если она отличается от локали сервера по умолчанию
#   {plugin}  Имя плагина
#   {reason}  Причина ошибки
#   {recovery}  Доступен ли JAR-файл для восстановления работающей версии
#   {remaining}  Время до следующей разрешённой проверки языков
#   {section}  Раздел редактора языков
#   {setting}  Название настройки или ключ сообщения
#   {target}  Цель выбора языка
#   {type}  Тип параметра команды
#   {updated}  Сообщения, изменённые обновлением языка
#   {value}  Текущее, стандартное или введённое значение
#   {variables}  Имена переменных, необходимых сообщению
#   {version}  Запрошенная или указанная версия плагина из библиотеки


# BileTools — ru_RU
#
# === Редактирование файла ===
# plugins/BileTools/languages/ru_RU.toml
# Этот файл можно редактировать напрямую. Локальные изменения сохраняются; для отсутствующих или неверных записей используется встроенный английский текст.
# /biletools language server edit ru_RU
#
# === Префикс ===
# Префикс &a[&8Bile&a]: записан непосредственно в каждом сообщении; меняйте его в нужных сообщениях.
#
# === Форматирование ===
# Цвета: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B и [RRGGBB]. Для своего оформления также доступен MiniMessage.
#
# === Переменные ===
# Не меняйте имена переменных и используйте только переменные исходного сообщения.
#   {after}  Ценность после изменения
#   {argument}  неожиданный аргумент
#   {before}  Ценность перед изменением
#   {category}  категория
#   {command}  путь команды
#   {context}  Причина перезагрузки плагина
#   {count}  Количество удалённых целей и выбор формы множественного числа; Количество сообщений
#   {file}  Имя JAR-файла плагина
#   {group}  категория
#   {host}  IP-адрес отправителя
#   {installedVersion}  Установленная сейчас версия плагина
#   {key}  Ключ сообщения или параметра
#   {latestVersion}  Последняя доступная версия в библиотеке
#   {line}  Источник строки или номер строки
#   {locale}  локаль
#   {maximum}  Максимально допустимая стоимость
#   {milliseconds}  Длительность загрузки, выгрузки или перезагрузки в миллисекундах
#   {new}  новое значение
#   {old}  предыдущее значение
#   {parameter}  имя параметра
#   {permission}  Необходимое право доступа
#   {personal}  личная локаль
#   {plugin}  Название плагина
#   {reason}  причина ошибки
#   {setting}  название настройки
#   {target}  Название плагина
#   {type}  тип
#   {usage}  использование команды
#   {value}  текущее, стандартное или исходное значение
#   {variables}  допустимые заполнители
#   {version}  Запрошенная или указанная версия плагина из библиотеки


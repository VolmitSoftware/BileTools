# BileTools — tr_TR
#
# === Dosyayı düzenleme ===
# plugins/BileTools/languages/tr_TR.toml
# Bu dosyayı doğrudan düzenleyebilirsiniz. Yerel değişiklikler korunur; eksik veya geçersiz girdiler yerleşik İngilizce metni kullanır.
# /biletools language server edit tr_TR
#
# === Önek ===
# &a[&8Bile&a]: öneki her iletide doğrudan yazılıdır; ilgili iletilerde düzenleyin.
#
# === Biçimlendirme ===
# Renkler: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B ve [RRGGBB]. Özel biçimlendirme için MiniMessage da kullanılabilir.
#
# === Değişkenler ===
# Değişken adlarını değiştirmeyin ve yalnızca ilgili iletinin değişkenlerini kullanın.
#   {after}  Değişim sonrası Değer
#   {argument}  beklenmeyen argüman
#   {before}  Değişim öncesinde değer
#   {category}  kategori
#   {command}  komut yolu
#   {context}  Eklentinin yeniden yüklenme nedeni
#   {count}  Uzak hedef sayısı ve çoğul biçim seçicisi; İleti sayısı
#   {file}  Eklenti JAR dosyasının adı
#   {group}  kategori
#   {host}  Gönderenin IP adresi
#   {installedVersion}  Şu anda kurulu eklenti sürümü
#   {key}  İleti veya parametre anahtarı
#   {latestVersion}  Kütüphanedeki en yeni sürüm
#   {line}  Source line or line number
#   {locale}  yerel ayar
#   {maximum}  Maksimum izin verilen değer
#   {milliseconds}  Yükleme, kaldırma veya yeniden yükleme süresi (milisaniye)
#   {new}  yeni değer
#   {old}  önceki değer
#   {parameter}  parametre adı
#   {permission}  Gerekli izin
#   {personal}  kişisel yerel ayar
#   {plugin}  Plugin name
#   {reason}  hata nedeni
#   {setting}  ayar adı
#   {target}  Plugin name
#   {type}  tür
#   {usage}  komut kullanımı
#   {value}  geçerli, varsayılan veya ham değer
#   {variables}  geçerli yer tutucular
#   {version}  İstenen veya gösterilen kütüphane eklentisi sürümü


# BileTools — tr_TR
#
# === Dosya düzenleme ===
# plugins/BileTools/languages/tr_TR.toml
# Bu dosyayı doğrudan düzenleyin. Yerel değişiklikler korunur; eksik veya geçersiz girdiler yerleşik İngilizce metni kullanır.
# /biletools language server edit tr_TR
#
# === Önek ===
# &a[&8Bile&a]: öneki her sohbet mesajının bir parçasıdır; öneki orada düzenleyin.
# Ayrı bir önek ayarı veya önek değişkeni yoktur.
#
# === Biçimlendirme ===
# Renkler ve stiller: &0-&f, &k-&r.
# RGB renkleri: &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B, [RRGGBB].
# MiniMessage özel biçimlendirmeyi destekler. & veya [ karakterini olduğu gibi göstermek için önüne ters eğik çizgi koyun.
#
# === Değişkenler ===
# Değişken adlarını değiştirmeyin ve yalnızca her mesaja ait değişkenleri kullanın.
#   {added}  Dil güncellemesiyle eklenen mesajlar
#   {after}  Düzenlemeden sonraki mesaj değeri
#   {argument}  Beklenmeyen komut argümanı
#   {before}  Düzenlemeden önceki mesaj değeri
#   {capability}  Gerekli temizleme yeteneklerinin kullanılabilirliği
#   {category}  Yapılandırma düzenleyicisi kategorisi
#   {command}  Komut yolu veya gönderilen komut
#   {context}  Eklentinin yeniden yüklenme nedeni veya tetikleyicisi
#   {cooperative}  Eklentinin işbirlikçi yeniden yüklemeyi uygulayıp uygulamadığı
#   {count}  Yapılandırılmış uzak dağıtım hedefi sayısı ve çoğul biçim seçicisi
#   {dependents}  Yeniden yükleme grubuna dahil edilen eklentiler
#   {enabled}  İncelenen eklentinin etkin olup olmadığı
#   {file}  Eklenti JAR dosyasının adı
#   {group}  Dil düzenleyicisi mesaj grubu
#   {host}  Gelen bağlantıyı gönderenin IP adresi
#   {installedVersion}  Şu anda kurulu eklenti sürümü
#   {kept}  Dil güncellemesinde korunan yerel düzenlemeler
#   {key}  Komut parametresi veya mesaj anahtarı
#   {latestVersion}  Kütüphanedeki en yeni sürüm
#   {line}  Liste mesajındaki satır numarası
#   {locale}  Yerel ayar kimliği
#   {maximum}  Düzenleyici girdisinin en fazla uzunluğu
#   {milliseconds}  Yükleme, bellekten kaldırma veya yeniden yükleme süresi (milisaniye)
#   {new}  Ayarın veya mesajın yeni değeri
#   {old}  Ayarın veya mesajın önceki değeri
#   {parameter}  Komut parametresi adı
#   {permission}  Gerekli izin düğümü
#   {personal}  Sunucu varsayılanından farklıysa kişisel yerel ayar
#   {plugin}  Eklenti adı
#   {reason}  Hata nedeni
#   {recovery}  Çalışan sürüm için kurtarma JAR dosyasının bulunup bulunmadığı
#   {remaining}  Bir sonraki dil denetimine izin verilene kadar kalan süre
#   {section}  Dil düzenleyicisi bölümü
#   {setting}  Ayar adı veya mesaj anahtarı
#   {target}  Dil seçiminin hedefi
#   {type}  Komut parametresi türü
#   {updated}  Dil güncellemesiyle değiştirilen mesajlar
#   {value}  Geçerli, varsayılan veya gönderilen değer
#   {variables}  Gerekli mesaj değişkeni adları
#   {version}  İstenen veya listelenen kütüphane eklentisi sürümü


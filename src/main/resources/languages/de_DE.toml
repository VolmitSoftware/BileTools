# BileTools — de_DE
#
# === Datei bearbeiten ===
# plugins/BileTools/languages/de_DE.toml
# Bearbeite diese Datei direkt. Lokale Änderungen bleiben erhalten; fehlende oder ungültige Einträge verwenden das eingebaute Englisch.
# /biletools language server edit de_DE
#
# === Präfix ===
# Das Präfix &a[&8Bile&a]: ist Teil jeder Chatnachricht; bearbeite es dort.
# Es gibt keine eigene Präfix-Einstellung und keinen Präfix-Platzhalter.
#
# === Formatierung ===
# Farben und Stile: &0-&f, &k-&r.
# RGB-Farben: &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B, [RRGGBB].
# MiniMessage unterstützt eigene Formatierungen. Setze einen Backslash vor & oder [, um das Zeichen wörtlich anzuzeigen.
#
# === Variablen ===
# Ändere keine Variablennamen und verwende nur die Variablen, die zur jeweiligen Nachricht gehören.
#   {added}  Durch eine Sprachaktualisierung hinzugefügte Nachrichten
#   {after}  Nachrichtenwert nach der Bearbeitung
#   {argument}  Unerwartetes Befehlsargument
#   {before}  Nachrichtenwert vor der Bearbeitung
#   {capability}  Verfügbarkeit der erforderlichen Abbaufunktionen
#   {category}  Kategorie des Konfigurationseditors
#   {command}  Befehlspfad oder eingegebener Befehl
#   {context}  Grund oder Auslöser für das Neuladen eines Plugins
#   {cooperative}  Ob das Plugin kooperatives Neuladen implementiert
#   {count}  Anzahl der konfigurierten Ziele für die Remote-Bereitstellung und Auswahl der Pluralform
#   {dependents}  Plugins in der Neuladegruppe
#   {enabled}  Ob das geprüfte Plugin aktiviert ist
#   {file}  Dateiname der Plugin-JAR
#   {group}  Nachrichtengruppe des Spracheditors
#   {host}  IP-Adresse des eingehenden Absenders
#   {installedVersion}  Derzeit installierte Plugin-Version
#   {kept}  Durch eine Sprachaktualisierung beibehaltene lokale Änderungen
#   {key}  Schlüssel des Befehlsparameters oder der Nachricht
#   {latestVersion}  Neueste verfügbare Bibliotheksversion
#   {line}  Zeilennummer innerhalb einer Listennachricht
#   {locale}  Sprachkennung
#   {maximum}  Maximale Eingabelänge im Editor
#   {milliseconds}  Dauer des Ladens, Entladens oder Neuladens in Millisekunden
#   {new}  Neuer Wert der Einstellung oder Nachricht
#   {old}  Vorheriger Wert der Einstellung oder Nachricht
#   {parameter}  Name des Befehlsparameters
#   {permission}  Erforderlicher Berechtigungsknoten
#   {personal}  Persönliche Sprachkennung, wenn sie vom Serverstandard abweicht
#   {plugin}  Plugin-Name
#   {reason}  Fehlergrund
#   {recovery}  Ob eine Wiederherstellungs-JAR der laufenden Version verfügbar ist
#   {remaining}  Zeit bis zur nächsten erlaubten Sprachprüfung
#   {section}  Abschnitt des Spracheditors
#   {setting}  Name der Einstellung oder Schlüssel der Nachricht
#   {target}  Ziel der Sprachauswahl
#   {type}  Typ des Befehlsparameters
#   {updated}  Durch eine Sprachaktualisierung geänderte Nachrichten
#   {value}  Aktueller, Standard- oder eingegebener Wert
#   {variables}  Namen der erforderlichen Nachrichtenvariablen
#   {version}  Angeforderte oder aufgelistete Version eines Bibliotheks-Plugins


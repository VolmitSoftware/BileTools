# BileTools — de_DE
#
# === Datei bearbeiten ===
# plugins/BileTools/languages/de_DE.toml
# Diese Datei kann direkt bearbeitet werden. Lokale Änderungen bleiben erhalten; fehlende oder ungültige Einträge verwenden das eingebaute Englisch.
# /biletools language server edit de_DE
#
# === Präfix ===
# Das Präfix &a[&8Bile&a]: steht direkt in jeder Nachricht; ändere es in den betreffenden Nachrichten.
#
# === Formatierung ===
# Farben: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B und [RRGGBB]. MiniMessage bleibt für eigene Formatierungen verfügbar.
#
# === Variablen ===
# Variablennamen unverändert lassen und nur die Variablen der jeweiligen Nachricht verwenden.
#   {after}  Wert nach der Änderung
#   {argument}  unerwartetes Argument
#   {before}  Wert vor der Änderung
#   {category}  Editorkategorie
#   {command}  Befehlspfad
#   {context}  Grund für das Neuladen des Plugins
#   {count}  Anzahl der Remote-Ziele und Auswahl der Pluralform; Anzahl der Nachrichten
#   {file}  Name der Plugin-JAR-Datei
#   {group}  Editorkategorie
#   {host}  IP-Adresse des Absenders
#   {installedVersion}  Derzeit installierte Plugin-Version
#   {key}  Nachrichten- oder Parameterschlüssel
#   {latestVersion}  Neueste verfügbare Bibliotheksversion
#   {line}  Quellleitung oder Zeilennummer
#   {locale}  Sprachkennung
#   {maximum}  Zulässiger Höchstwert
#   {milliseconds}  Dauer des Ladens, Entladens oder Neuladens in Millisekunden
#   {new}  neuer Wert
#   {old}  vorheriger Wert
#   {parameter}  Parametername
#   {permission}  Erforderliche Berechtigung
#   {personal}  persönliche Sprachkennung
#   {plugin}  Plugin Name
#   {reason}  Fehlergrund
#   {section}  Abschnitt des Spracheneditors
#   {setting}  Einstellungsname
#   {target}  Plugin Name
#   {type}  Parametertyp
#   {value}  aktueller, Standard- oder Rohwert
#   {variables}  gültige Platzhalter
#   {version}  Angeforderte oder angezeigte Bibliotheks-Plugin-Version


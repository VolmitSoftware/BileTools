# BileTools — lt_LT
#
# === Failo redagavimas ===
# plugins/BileTools/languages/lt_LT.toml
# Redaguokite šį failą tiesiogiai. Vietiniai pakeitimai išsaugomi; trūkstamiems arba netinkamiems įrašams naudojama integruota anglų kalba.
# /biletools language server edit lt_LT
#
# === Priešdėlis ===
# Priešdėlis &a[&8Bile&a]: yra kiekvieno pokalbio pranešimo dalis; redaguokite jį ten.
# Atskiro priešdėlio nustatymo ar priešdėlio kintamojo nėra.
#
# === Formatavimas ===
# Spalvos ir stiliai: &0-&f, &k-&r.
# RGB spalvos: &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B, [RRGGBB].
# MiniMessage palaiko pasirinktinį formatavimą. Kad & arba [ būtų rodomi pažodžiui, prieš juos parašykite atvirkštinį pasvirąjį brūkšnį.
#
# === Kintamieji ===
# Nekeiskite kintamųjų pavadinimų ir naudokite tik tam pranešimui priklausančius kintamuosius.
#   {added}  Kalbos atnaujinimo pridėti pranešimai
#   {after}  Pranešimo reikšmė po redagavimo
#   {argument}  Netikėtas komandos argumentas
#   {before}  Pranešimo reikšmė prieš redagavimą
#   {capability}  Reikiamų uždarymo galimybių prieinamumas
#   {category}  Konfigūracijos rengyklės kategorija
#   {command}  Komandos kelias arba pateikta komanda
#   {context}  Papildinio įkėlimo iš naujo priežastis arba paleidiklis
#   {cooperative}  Ar papildinys palaiko kooperatinį įkėlimą iš naujo
#   {count}  Sukonfigūruotų nuotolinio diegimo tikslų skaičius ir daugiskaitos formos parinkiklis
#   {dependents}  Į įkėlimo iš naujo grupę įtraukti papildiniai
#   {enabled}  Ar tikrinamas papildinys įjungtas
#   {file}  Papildinio JAR failo pavadinimas
#   {group}  Kalbų rengyklės pranešimų grupė
#   {host}  Gaunamo siuntėjo IP adresas
#   {installedVersion}  Šiuo metu įdiegta papildinio versija
#   {kept}  Kalbos atnaujinimo išsaugoti vietiniai pakeitimai
#   {key}  Komandos parametro arba pranešimo raktas
#   {latestVersion}  Naujausia bibliotekoje prieinama versija
#   {line}  Eilutės numeris sąrašo pranešime
#   {locale}  Lokalės identifikatorius
#   {maximum}  Didžiausias rengyklės įvesties ilgis
#   {milliseconds}  Įkėlimo, iškėlimo arba įkėlimo iš naujo trukmė milisekundėmis
#   {new}  Nauja nustatymo arba pranešimo reikšmė
#   {old}  Ankstesnė nustatymo arba pranešimo reikšmė
#   {parameter}  Komandos parametro pavadinimas
#   {permission}  Reikalingas leidimo mazgas
#   {personal}  Asmeninė lokalė, jei ji skiriasi nuo numatytosios serverio lokalės
#   {plugin}  Papildinio pavadinimas
#   {reason}  Nesėkmės priežastis
#   {recovery}  Ar yra veikiančios versijos atkūrimo JAR failas
#   {remaining}  Laikas, kol bus leidžiama vėl tikrinti kalbas
#   {section}  Kalbų rengyklės skiltis
#   {setting}  Nustatymo pavadinimas arba pranešimo raktas
#   {target}  Kalbos pasirinkimo tikslas
#   {type}  Komandos parametro tipas
#   {updated}  Kalbos atnaujinimo pakeisti pranešimai
#   {value}  Dabartinė, numatytoji arba pateikta reikšmė
#   {variables}  Reikalingų pranešimo kintamųjų pavadinimai
#   {version}  Prašoma arba išvardyta bibliotekos papildinio versija


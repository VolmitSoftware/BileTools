# BileTools — ja-JP
#
# === ファイルの編集 ===
# plugins/BileTools/languages/ja-JP.toml
# このファイルを直接編集してください。ローカルの変更は保持され、不足または無効な項目には内蔵の英語が使われます。
# /biletools language server edit ja-JP
#
# === 接頭辞 ===
# 接頭辞 &a[&8Bile&a]: は各チャットメッセージの一部です。変更する場合は各メッセージ内で編集してください。
# 接頭辞専用の設定や接頭辞用の変数はありません。
#
# === 書式 ===
# 色とスタイル: &0-&f、&k-&r。
# RGBカラー: &#RRGGBB、&xRRGGBB、&x&R&R&G&G&B&B、[RRGGBB]。
# MiniMessage で独自の書式を使用できます。& や [ をそのまま表示するには、前にバックスラッシュを付けてください。
#
# === 変数 ===
# 変数名は変更せず、各メッセージに属する変数だけを使用してください。
#   {added}  言語更新で追加されたメッセージ
#   {after}  編集後のメッセージの値
#   {argument}  予期しないコマンド引数
#   {before}  編集前のメッセージの値
#   {capability}  必要な終了処理機能の利用可否
#   {category}  設定エディターのカテゴリ
#   {command}  コマンドのパスまたは送信されたコマンド
#   {context}  プラグインを再読み込みする理由またはきっかけ
#   {cooperative}  プラグインが協調再読み込みを実装しているかどうか
#   {count}  設定されたリモート配信先の数と複数形の選択値
#   {dependents}  再読み込みグループに含まれるプラグイン
#   {enabled}  確認対象のプラグインが有効かどうか
#   {file}  プラグインのJARファイル名
#   {group}  言語エディターのメッセージグループ
#   {host}  受信した送信元のIPアドレス
#   {installedVersion}  現在インストールされているプラグインのバージョン
#   {kept}  言語更新で保持されたローカル編集
#   {key}  コマンドパラメーターまたはメッセージのキー
#   {latestVersion}  ライブラリで利用可能な最新バージョン
#   {line}  リストメッセージ内の行番号
#   {locale}  ロケールID
#   {maximum}  エディター入力の最大文字数
#   {milliseconds}  読み込み、アンロード、再読み込みの所要時間（ミリ秒）
#   {new}  設定またはメッセージの新しい値
#   {old}  設定またはメッセージの以前の値
#   {parameter}  コマンドパラメーター名
#   {permission}  必要な権限ノード
#   {personal}  サーバーのデフォルトと異なる場合の個人ロケール
#   {plugin}  プラグイン名
#   {reason}  失敗の理由
#   {recovery}  実行中バージョンの復元用JARがあるかどうか
#   {remaining}  次の言語確認が可能になるまでの時間
#   {section}  言語エディターのセクション
#   {setting}  設定名またはメッセージのキー
#   {target}  言語選択の対象
#   {type}  コマンドパラメーターの型
#   {updated}  言語更新で変更されたメッセージ
#   {value}  現在の値、デフォルト値、または入力された値
#   {variables}  必要なメッセージ変数名
#   {version}  要求された、または一覧表示されたライブラリプラグインのバージョン


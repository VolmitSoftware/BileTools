# BileTools — ja-JP
#
# === ファイルの編集 ===
# plugins/BileTools/languages/ja-JP.toml
# このファイルを直接編集できます。ローカルの変更は保持され、不足または無効な項目には内蔵の英語を使用します。
# /biletools language server edit ja-JP
#
# === 接頭辞 ===
# 接頭辞 &a[&8Bile&a]: は各メッセージに直接記述されています。変更する場合は該当するメッセージを編集してください。
#
# === 書式 ===
# 色: &0-&f、&k-&r、&#RRGGBB、&xRRGGBB、&x&R&R&G&G&B&B、[RRGGBB]。独自書式には MiniMessage も使用できます。
#
# === 変数 ===
# 変数名を変更せず、各メッセージに元からある変数だけを使用してください。
#   {after}  変更後の値
#   {argument}  予期しない引数
#   {before}  変更前の値
#   {category}  カテゴリ
#   {command}  コマンド経路
#   {context}  プラグインを再読み込みする理由
#   {count}  リモート配信先の数と複数形の選択値; メッセージ数
#   {file}  プラグインのJARファイル名
#   {group}  カテゴリ
#   {host}  送信元のIPアドレス
#   {installedVersion}  現在インストールされているプラグインのバージョン
#   {key}  メッセージまたはパラメーターのキー
#   {latestVersion}  ライブラリで利用可能な最新バージョン
#   {line}  ラインまたはライン番号
#   {locale}  ロケール
#   {maximum}  最大許容値
#   {milliseconds}  読み込み、解除、再読み込みの所要時間（ミリ秒）
#   {new}  変更後の値
#   {old}  変更前の値
#   {parameter}  パラメーター名
#   {permission}  必要な権限
#   {personal}  個人設定のロケール
#   {plugin}  プラグイン名
#   {reason}  失敗理由
#   {section}  言語エディターのセクション
#   {setting}  設定名
#   {target}  プラグイン名
#   {type}  型
#   {value}  現在値、既定値、または入力値
#   {variables}  使用可能なプレースホルダー
#   {version}  要求または表示されたライブラリプラグインのバージョン


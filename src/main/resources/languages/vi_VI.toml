# BileTools — vi_VI
#
# === Chỉnh sửa tệp ===
# plugins/BileTools/languages/vi_VI.toml
# Hãy chỉnh sửa trực tiếp tệp này. Thay đổi cục bộ được giữ lại; mục bị thiếu hoặc không hợp lệ sẽ dùng bản tiếng Anh tích hợp sẵn.
# /biletools language server edit vi_VI
#
# === Tiền tố ===
# Tiền tố &a[&8Bile&a]: là một phần của mỗi thông báo trò chuyện; hãy sửa nó ngay trong thông báo đó.
# Không có cài đặt tiền tố riêng hay biến tiền tố.
#
# === Định dạng ===
# Màu và kiểu chữ: &0-&f, &k-&r.
# Màu RGB: &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B, [RRGGBB].
# MiniMessage hỗ trợ định dạng tùy chỉnh. Đặt dấu gạch chéo ngược trước & hoặc [ để hiển thị nguyên ký tự đó.
#
# === Biến ===
# Giữ nguyên tên biến và chỉ dùng những biến thuộc về từng thông báo.
#   {added}  Thông báo được thêm bởi bản cập nhật ngôn ngữ
#   {after}  Giá trị thông báo sau khi chỉnh sửa
#   {argument}  Đối số lệnh ngoài dự kiến
#   {before}  Giá trị thông báo trước khi chỉnh sửa
#   {capability}  Tình trạng sẵn có của các khả năng dọn dẹp cần thiết
#   {category}  Danh mục của trình chỉnh sửa cài đặt
#   {command}  Đường dẫn lệnh hoặc lệnh đã gửi
#   {context}  Lý do hoặc nguyên nhân nạp lại plugin
#   {cooperative}  Plugin có hỗ trợ nạp lại phối hợp hay không
#   {count}  Số máy chủ đích triển khai từ xa đã cấu hình và bộ chọn dạng số nhiều
#   {dependents}  Các plugin thuộc nhóm nạp lại
#   {enabled}  Plugin được kiểm tra có đang bật hay không
#   {file}  Tên tệp JAR của plugin
#   {group}  Nhóm thông báo trong trình chỉnh sửa ngôn ngữ
#   {host}  Địa chỉ IP của bên gửi đến
#   {installedVersion}  Phiên bản plugin hiện đang cài
#   {kept}  Chỉnh sửa cục bộ được giữ lại khi cập nhật ngôn ngữ
#   {key}  Khóa tham số lệnh hoặc khóa thông báo
#   {latestVersion}  Phiên bản mới nhất có trong thư viện
#   {line}  Số dòng trong một thông báo dạng danh sách
#   {locale}  Mã ngôn ngữ
#   {maximum}  Độ dài tối đa của nội dung nhập trong trình chỉnh sửa
#   {milliseconds}  Thời gian nạp, gỡ khỏi bộ nhớ hoặc nạp lại tính bằng mili giây
#   {new}  Giá trị mới của cài đặt hoặc thông báo
#   {old}  Giá trị trước đó của cài đặt hoặc thông báo
#   {parameter}  Tên tham số lệnh
#   {permission}  Nút quyền cần có
#   {personal}  Mã ngôn ngữ cá nhân khi khác với mặc định của máy chủ
#   {plugin}  Tên plugin
#   {reason}  Lý do thất bại
#   {recovery}  Có tệp JAR khôi phục của phiên bản đang chạy hay không
#   {remaining}  Thời gian còn lại đến lần kiểm tra ngôn ngữ tiếp theo
#   {section}  Mục trong trình chỉnh sửa ngôn ngữ
#   {setting}  Tên cài đặt hoặc khóa thông báo
#   {target}  Đối tượng của lựa chọn ngôn ngữ
#   {type}  Kiểu tham số lệnh
#   {updated}  Thông báo được thay đổi bởi bản cập nhật ngôn ngữ
#   {value}  Giá trị hiện tại, mặc định hoặc đã nhập
#   {variables}  Tên các biến bắt buộc của thông báo
#   {version}  Phiên bản plugin thư viện được yêu cầu hoặc liệt kê


# BileTools — vi_VI
#
# === Chỉnh sửa tệp ===
# plugins/BileTools/languages/vi_VI.toml
# Bạn có thể chỉnh sửa trực tiếp tệp này. Thay đổi cục bộ được giữ lại; mục thiếu hoặc không hợp lệ dùng bản tiếng Anh tích hợp.
# /biletools language server edit vi_VI
#
# === Tiền tố ===
# Tiền tố &a[&8Bile&a]: được viết trực tiếp trong mỗi thông báo; hãy sửa tại các thông báo tương ứng.
#
# === Định dạng ===
# Màu: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B và [RRGGBB]. MiniMessage vẫn dùng được cho định dạng tùy chỉnh.
#
# === Biến ===
# Giữ nguyên tên biến và chỉ dùng những biến có sẵn trong từng thông báo.
#   {after}  Giá trị sau khi thay đổi
#   {argument}  đối số ngoài dự kiến
#   {before}  Giá trị trước khi thay đổi
#   {category}  danh mục
#   {command}  đường dẫn lệnh
#   {context}  Lý do tải lại plugin
#   {count}  Số đích từ xa và giá trị chọn dạng số nhiều; Số thông báo
#   {file}  Tên tệp JAR của plugin
#   {group}  danh mục
#   {host}  Địa chỉ IP của người gửi
#   {installedVersion}  Phiên bản plugin hiện được cài đặt
#   {key}  Khóa thông báo hoặc tham số
#   {latestVersion}  Phiên bản mới nhất có trong thư viện
#   {line}  Số dòng hay dòng nguồn
#   {locale}  mã vùng
#   {maximum}  Giá trị được chấp nhận tối đa
#   {milliseconds}  Thời gian tải, gỡ hoặc tải lại tính bằng mili giây
#   {new}  giá trị mới
#   {old}  giá trị trước
#   {parameter}  tên tham số
#   {permission}  Quyền cần có
#   {personal}  mã vùng cá nhân
#   {plugin}  Tên phần bổ sung
#   {reason}  lý do lỗi
#   {section}  Mục trong trình chỉnh sửa ngôn ngữ
#   {setting}  tên cài đặt
#   {target}  Tên phần bổ sung
#   {type}  kiểu
#   {value}  giá trị hiện tại, mặc định hoặc thô
#   {variables}  chỗ giữ chỗ hợp lệ
#   {version}  Phiên bản plugin thư viện được yêu cầu hoặc liệt kê


# BileTools — ko_KR
#
# === 파일 편집 ===
# plugins/BileTools/languages/ko_KR.toml
# 이 파일을 직접 편집할 수 있습니다. 로컬 변경은 유지되며, 누락되거나 잘못된 항목에는 내장 영어를 사용합니다.
# /biletools language server edit ko_KR
#
# === 접두사 ===
# 접두사 &a[&8Bile&a]: 는 각 메시지에 직접 적혀 있습니다. 변경하려면 해당 메시지를 수정하세요.
#
# === 서식 ===
# 색상: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B, [RRGGBB]. 사용자 지정 서식에는 MiniMessage도 사용할 수 있습니다.
#
# === 변수 ===
# 변수 이름을 변경하지 말고 각 메시지에 원래 있는 변수만 사용하세요.
#   {after}  변경 후 가치
#   {argument}  예상하지 못한 인수
#   {before}  변경 전의 값
#   {category}  편집기 범주
#   {command}  명령 경로
#   {context}  플러그인을 다시 불러오는 이유
#   {count}  원격 대상 수와 복수형 선택 값; 메시지 수
#   {file}  플러그인 JAR 파일 이름
#   {group}  편집기 범주
#   {host}  발신자의 IP 주소
#   {installedVersion}  현재 설치된 플러그인 버전
#   {key}  메시지 또는 매개변수 키
#   {latestVersion}  라이브러리에서 사용 가능한 최신 버전
#   {line}  소스 라인 또는 라인 번호
#   {locale}  로케일
#   {maximum}  최대 허용 값
#   {milliseconds}  불러오기, 해제 또는 다시 불러오기에 걸린 시간(밀리초)
#   {new}  새 값
#   {old}  이전 값
#   {parameter}  매개변수 이름
#   {permission}  필요한 권한
#   {personal}  개인 로케일
#   {plugin}  Plugin 이름
#   {reason}  실패 이유
#   {section}  언어 편집기 섹션
#   {setting}  설정 이름
#   {target}  Plugin 이름
#   {type}  형식
#   {value}  현재값, 기본값 또는 원시값
#   {variables}  사용 가능한 자리표시자
#   {version}  요청되거나 표시된 라이브러리 플러그인 버전


# BileTools — ko_KR
#
# === 파일 편집 ===
# plugins/BileTools/languages/ko_KR.toml
# 이 파일을 직접 편집하세요. 로컬 변경 사항은 유지되며, 누락되거나 잘못된 항목에는 내장 영어가 사용됩니다.
# /biletools language server edit ko_KR
#
# === 접두사 ===
# 접두사 &a[&8Bile&a]: 는 각 채팅 메시지의 일부입니다. 변경하려면 각 메시지에서 직접 편집하세요.
# 접두사 전용 설정이나 접두사 변수는 없습니다.
#
# === 서식 ===
# 색상과 스타일: &0-&f, &k-&r.
# RGB 색상: &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B, [RRGGBB].
# MiniMessage로 사용자 지정 서식을 사용할 수 있습니다. & 또는 [ 를 그대로 표시하려면 앞에 백슬래시를 붙이세요.
#
# === 변수 ===
# 변수 이름은 바꾸지 말고 각 메시지에 속한 변수만 사용하세요.
#   {added}  언어 업데이트로 추가된 메시지
#   {after}  편집 후 메시지 값
#   {argument}  예상하지 못한 명령어 인수
#   {before}  편집 전 메시지 값
#   {capability}  필요한 종료 처리 기능의 사용 가능 여부
#   {category}  설정 편집기 카테고리
#   {command}  명령어 경로 또는 입력된 명령어
#   {context}  플러그인을 다시 로드하는 이유 또는 계기
#   {cooperative}  플러그인이 협력형 다시 로드를 구현하는지 여부
#   {count}  설정된 원격 배포 대상 수와 복수형 선택 값
#   {dependents}  다시 로드 그룹에 포함된 플러그인
#   {enabled}  검사한 플러그인의 활성화 여부
#   {file}  플러그인 JAR 파일 이름
#   {group}  언어 편집기 메시지 그룹
#   {host}  수신된 발신자의 IP 주소
#   {installedVersion}  현재 설치된 플러그인 버전
#   {kept}  언어 업데이트에서 유지된 로컬 편집
#   {key}  명령어 매개변수 키 또는 메시지 키
#   {latestVersion}  라이브러리에서 사용 가능한 최신 버전
#   {line}  목록 메시지 안의 줄 번호
#   {locale}  로케일 ID
#   {maximum}  편집기 입력의 최대 길이
#   {milliseconds}  로드, 언로드 또는 다시 로드에 걸린 시간(밀리초)
#   {new}  설정 또는 메시지의 새 값
#   {old}  설정 또는 메시지의 이전 값
#   {parameter}  명령어 매개변수 이름
#   {permission}  필요한 권한 노드
#   {personal}  서버 기본값과 다를 때의 개인 로케일
#   {plugin}  플러그인 이름
#   {reason}  실패 이유
#   {recovery}  실행 중인 버전의 복구용 JAR가 있는지 여부
#   {remaining}  다음 언어 확인이 가능해질 때까지 남은 시간
#   {section}  언어 편집기 섹션
#   {setting}  설정 이름 또는 메시지 키
#   {target}  언어 선택 대상
#   {type}  명령어 매개변수 유형
#   {updated}  언어 업데이트로 변경된 메시지
#   {value}  현재 값, 기본값 또는 입력된 값
#   {variables}  필요한 메시지 변수 이름
#   {version}  요청되거나 목록에 표시된 라이브러리 플러그인 버전


# BileTools — it_IT
#
# === Modifica del file ===
# plugins/BileTools/languages/it_IT.toml
# Puoi modificare direttamente questo file. Le modifiche locali vengono conservate; le voci mancanti o non valide usano l’inglese incorporato.
# /biletools language server edit it_IT
#
# === Prefisso ===
# Il prefisso &a[&8Bile&a]: è scritto direttamente in ogni messaggio; modificalo nei messaggi interessati.
#
# === Formattazione ===
# Colori: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B e [RRGGBB]. MiniMessage resta disponibile per formati personalizzati.
#
# === Variabili ===
# Mantieni i nomi delle variabili e usa solo quelle previste dal singolo messaggio.
#   {after}  Valore dopo il cambiamento
#   {argument}  argomento inatteso
#   {before}  Valore prima della modifica
#   {category}  categoria
#   {command}  percorso del comando
#   {context}  Motivo del ricaricamento del plugin
#   {count}  Numero di destinazioni remote e selettore del plurale; Numero di messaggi
#   {file}  Nome del file JAR del plugin
#   {group}  categoria
#   {host}  Indirizzo IP del mittente
#   {installedVersion}  Versione del plugin attualmente installata
#   {key}  Chiave del messaggio o del parametro
#   {latestVersion}  Ultima versione disponibile nella libreria
#   {line}  Linea di origine o numero di linea
#   {locale}  codice locale
#   {maximum}  Valore massimo consentito
#   {milliseconds}  Durata di caricamento, scaricamento o ricaricamento in millisecondi
#   {new}  valore nuovo
#   {old}  valore precedente
#   {parameter}  nome parametro
#   {permission}  Permesso richiesto
#   {personal}  codice locale personale
#   {plugin}  Nome del plugin
#   {reason}  motivo errore
#   {section}  Sezione dell’editor delle lingue
#   {setting}  nome impostazione
#   {target}  Nome del plugin
#   {type}  tipo
#   {value}  valore corrente, predefinito o grezzo
#   {variables}  segnaposto validi
#   {version}  Versione richiesta o visualizzata del plugin della libreria


# BileTools — it_IT
#
# === Modifica del file ===
# plugins/BileTools/languages/it_IT.toml
# Modifica direttamente questo file. Le modifiche locali vengono conservate; le voci mancanti o non valide usano l'inglese incorporato.
# /biletools language server edit it_IT
#
# === Prefisso ===
# Il prefisso &a[&8Bile&a]: fa parte di ogni messaggio della chat; modificalo lì.
# Non esistono un'impostazione separata per il prefisso né una variabile per il prefisso.
#
# === Formattazione ===
# Colori e stili: &0-&f, &k-&r.
# Colori RGB: &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B, [RRGGBB].
# MiniMessage supporta la formattazione personalizzata. Metti una barra rovesciata prima di & o [ per mostrarli letteralmente.
#
# === Variabili ===
# Non modificare i nomi delle variabili e usa solo le variabili previste da ciascun messaggio.
#   {added}  Messaggi aggiunti da un aggiornamento della lingua
#   {after}  Valore del messaggio dopo la modifica
#   {argument}  Argomento del comando imprevisto
#   {before}  Valore del messaggio prima della modifica
#   {capability}  Disponibilità delle funzionalità di smontaggio richieste
#   {category}  Categoria dell'editor della configurazione
#   {command}  Percorso del comando o comando inviato
#   {context}  Motivo o causa del ricaricamento di un plugin
#   {cooperative}  Se il plugin implementa il ricaricamento cooperativo
#   {count}  Numero di destinazioni di distribuzione remota configurate e selettore del plurale
#   {dependents}  Plugin inclusi nel gruppo di ricaricamento
#   {enabled}  Se il plugin ispezionato è abilitato
#   {file}  Nome del file JAR del plugin
#   {group}  Gruppo di messaggi dell'editor delle lingue
#   {host}  Indirizzo IP del mittente in ingresso
#   {installedVersion}  Versione del plugin attualmente installata
#   {kept}  Modifiche locali conservate da un aggiornamento della lingua
#   {key}  Chiave del parametro del comando o del messaggio
#   {latestVersion}  Ultima versione disponibile nella libreria
#   {line}  Numero di riga in un messaggio a elenco
#   {locale}  Identificatore del codice locale
#   {maximum}  Lunghezza massima del testo inserito nell'editor
#   {milliseconds}  Durata di caricamento, scaricamento o ricaricamento in millisecondi
#   {new}  Nuovo valore dell'impostazione o del messaggio
#   {old}  Valore precedente dell'impostazione o del messaggio
#   {parameter}  Nome del parametro del comando
#   {permission}  Nodo di permesso richiesto
#   {personal}  Codice locale personale, se diverso da quello predefinito del server
#   {plugin}  Nome del plugin
#   {reason}  Motivo dell'errore
#   {recovery}  Se è disponibile un JAR di ripristino della versione in esecuzione
#   {remaining}  Tempo che manca prima che sia consentito il prossimo controllo delle lingue
#   {section}  Sezione dell'editor delle lingue
#   {setting}  Nome dell'impostazione o chiave del messaggio
#   {target}  Destinazione della scelta della lingua
#   {type}  Tipo del parametro del comando
#   {updated}  Messaggi modificati da un aggiornamento della lingua
#   {value}  Valore attuale, predefinito o inviato
#   {variables}  Nomi delle variabili richieste dal messaggio
#   {version}  Versione richiesta o elencata del plugin della libreria


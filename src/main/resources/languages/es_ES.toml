# BileTools — es_ES
#
# === Editar el archivo ===
# plugins/BileTools/languages/es_ES.toml
# Puede editar este archivo directamente. Los cambios locales se conservan; las entradas ausentes o no válidas usan el inglés incorporado.
# /biletools language server edit es_ES
#
# === Prefijo ===
# El prefijo &a[&8Bile&a]: está escrito directamente en cada mensaje; edítalo en los mensajes correspondientes.
#
# === Formato ===
# Colores: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B y [RRGGBB]. MiniMessage sigue disponible para formatos personalizados.
#
# === Variables ===
# Mantenga los nombres de las variables y use solo las que ya contiene cada mensaje.
#   {after}  Valor después del cambio
#   {argument}  argumento inesperado
#   {before}  Valor antes del cambio
#   {category}  categoría
#   {command}  ruta del comando
#   {context}  Motivo de la recarga del plugin
#   {count}  Número de destinos remotos y selector de plural; Número de mensajes
#   {file}  Nombre del archivo JAR del plugin
#   {group}  categoría
#   {host}  Dirección IP del remitente
#   {installedVersion}  Versión del plugin instalada actualmente
#   {key}  Clave del mensaje o parámetro
#   {latestVersion}  Última versión disponible en la biblioteca
#   {line}  Línea de origen o número de línea
#   {locale}  configuración regional
#   {maximum}  Valor máximo permitido
#   {milliseconds}  Duración de carga, descarga o recarga en milisegundos
#   {new}  valor nuevo
#   {old}  valor anterior
#   {parameter}  nombre del parámetro
#   {permission}  Permiso necesario
#   {personal}  configuración regional personal
#   {plugin}  Nombre de plugin
#   {reason}  motivo del fallo
#   {section}  Sección del editor de idiomas
#   {setting}  ajuste
#   {target}  Nombre de plugin
#   {type}  tipo
#   {value}  valor actual, predeterminado o sin procesar
#   {variables}  marcadores válidos
#   {version}  Versión solicitada o mostrada del plugin de la biblioteca


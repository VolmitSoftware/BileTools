# BileTools — es_ES
#
# === Edición del archivo ===
# plugins/BileTools/languages/es_ES.toml
# Edita este archivo directamente. Los cambios locales se conservan; las entradas ausentes o no válidas usan el inglés integrado.
# /biletools language server edit es_ES
#
# === Prefijo ===
# El prefijo &a[&8Bile&a]: forma parte de cada mensaje del chat; edítalo ahí.
# No hay un ajuste de prefijo independiente ni una variable de prefijo.
#
# === Formato ===
# Colores y estilos: &0-&f, &k-&r.
# Colores RGB: &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B, [RRGGBB].
# MiniMessage admite formato personalizado. Pon una barra invertida delante de & o [ para mostrarlos literalmente.
#
# === Variables ===
# No cambies los nombres de las variables y usa solo las variables de cada mensaje.
#   {added}  Mensajes añadidos por una actualización de idioma
#   {after}  Valor del mensaje después de la edición
#   {argument}  Argumento de comando inesperado
#   {before}  Valor del mensaje antes de la edición
#   {capability}  Disponibilidad de las capacidades de desmontaje necesarias
#   {category}  Categoría del editor de configuración
#   {command}  Ruta del comando o comando enviado
#   {context}  Motivo o desencadenante de la recarga de un plugin
#   {cooperative}  Si el plugin implementa la recarga cooperativa
#   {count}  Número de destinos de despliegue remoto configurados y selector de plural
#   {dependents}  Plugins incluidos en el grupo de recarga
#   {enabled}  Si el plugin inspeccionado está habilitado
#   {file}  Nombre del archivo JAR del plugin
#   {group}  Grupo de mensajes del editor de idiomas
#   {host}  Dirección IP del emisor de la conexión entrante
#   {installedVersion}  Versión del plugin instalada actualmente
#   {kept}  Ediciones locales conservadas por una actualización de idioma
#   {key}  Clave del parámetro del comando o del mensaje
#   {latestVersion}  Última versión disponible en la biblioteca
#   {line}  Número de línea dentro de un mensaje de lista
#   {locale}  Identificador de la configuración regional
#   {maximum}  Longitud máxima de la entrada del editor
#   {milliseconds}  Duración de la carga, descarga o recarga en milisegundos
#   {new}  Nuevo valor del ajuste o del mensaje
#   {old}  Valor anterior del ajuste o del mensaje
#   {parameter}  Nombre del parámetro del comando
#   {permission}  Nodo de permiso necesario
#   {personal}  Configuración regional personal, si difiere de la predeterminada del servidor
#   {plugin}  Nombre del plugin
#   {reason}  Motivo del fallo
#   {recovery}  Si hay disponible un JAR de recuperación de la versión en ejecución
#   {remaining}  Tiempo que falta para poder comprobar de nuevo los idiomas
#   {section}  Sección del editor de idiomas
#   {setting}  Nombre del ajuste o clave del mensaje
#   {target}  Destino de la selección de idioma
#   {type}  Tipo del parámetro del comando
#   {updated}  Mensajes cambiados por una actualización de idioma
#   {value}  Valor actual, predeterminado o enviado
#   {variables}  Nombres de las variables necesarias del mensaje
#   {version}  Versión solicitada o listada del plugin de la biblioteca


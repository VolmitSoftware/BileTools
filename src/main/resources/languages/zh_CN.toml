# BileTools — zh_CN
#
# === 编辑文件 ===
# plugins/BileTools/languages/zh_CN.toml
# 可直接编辑此文件。本地修改会保留；缺失或无效条目使用内置英语文本。
# /biletools language server edit zh_CN
#
# === 前缀 ===
# 前缀 &a[&8Bile&a]: 直接写在每条消息中；请在相应消息中修改。
#
# === 格式 ===
# 颜色：&0-&f、&k-&r、&#RRGGBB、&xRRGGBB、&x&R&R&G&G&B&B 和 [RRGGBB]。自定义格式仍可使用 MiniMessage。
#
# === 变量 ===
# 请勿更改变量名，仅使用各消息中原有的变量。
#   {after}  更改后的数值
#   {argument}  意外参数
#   {before}  变化前的价值
#   {category}  编辑器分类
#   {command}  命令路径
#   {context}  重新加载插件的原因
#   {count}  远程目标数量及复数形式选择值; 消息数量
#   {file}  插件 JAR 文件名
#   {group}  编辑器分类
#   {host}  发送方的 IP 地址
#   {installedVersion}  当前安装的插件版本
#   {key}  消息或参数的键
#   {latestVersion}  库中可用的最新版本
#   {line}  源行或行号
#   {locale}  区域设置
#   {maximum}  允许的最大值
#   {milliseconds}  加载、卸载或重新加载的耗时（毫秒）
#   {new}  新值
#   {old}  旧值
#   {parameter}  参数名称
#   {permission}  所需权限
#   {personal}  个人区域设置
#   {plugin}  插件名称
#   {reason}  失败原因
#   {setting}  设置名称
#   {target}  插件名称
#   {type}  类型
#   {usage}  命令用法
#   {value}  当前值、默认值或原始值
#   {variables}  可用占位符
#   {version}  请求或列出的库插件版本


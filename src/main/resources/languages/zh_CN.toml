# BileTools — zh_CN
#
# === 文件编辑 ===
# plugins/BileTools/languages/zh_CN.toml
# 可直接编辑此文件。本地修改会被保留；缺失或无效的条目使用内置英文文本。
# /biletools language server edit zh_CN
#
# === 前缀 ===
# 前缀 &a[&8Bile&a]: 是每条聊天消息的一部分，请直接在消息中修改。
# 没有单独的前缀设置或前缀占位符。
#
# === 格式 ===
# 颜色和样式：&0-&f、&k-&r。
# RGB 颜色：&#RRGGBB、&xRRGGBB、&x&R&R&G&G&B&B、[RRGGBB]。
# MiniMessage 支持自定义格式。在 & 或 [ 前加反斜杠可将其按原样显示。
#
# === 变量 ===
# 请勿更改变量名，每条消息只能使用属于它的变量。
#   {added}  语言更新新增的消息
#   {after}  编辑后的消息值
#   {argument}  意外的命令参数
#   {before}  编辑前的消息值
#   {capability}  所需清理能力的可用情况
#   {category}  配置编辑器分类
#   {command}  命令路径或提交的命令
#   {context}  插件重载的原因或触发条件
#   {cooperative}  插件是否实现协作式重载
#   {count}  已配置的远程部署目标数量及复数选择值
#   {dependents}  重载组中包含的插件
#   {enabled}  所检查的插件是否已启用
#   {file}  插件 JAR 文件名
#   {group}  语言编辑器消息组
#   {host}  传入发送方的 IP 地址
#   {installedVersion}  当前已安装的插件版本
#   {kept}  语言更新保留的本地修改
#   {key}  命令参数键或消息键
#   {latestVersion}  库中可用的最新版本
#   {line}  列表消息中的行号
#   {locale}  语言代码
#   {maximum}  编辑器输入的最大长度
#   {milliseconds}  加载、卸载或重载耗时（毫秒）
#   {new}  配置项或消息的新值
#   {old}  配置项或消息的旧值
#   {parameter}  命令参数名称
#   {permission}  所需的权限节点
#   {personal}  与服务器默认值不同时的个人语言代码
#   {plugin}  插件名称
#   {reason}  失败原因
#   {recovery}  是否有用于恢复当前运行版本的 JAR 文件
#   {remaining}  距离下次允许检查语言的时间
#   {section}  语言编辑器分区
#   {setting}  配置项名称或消息键
#   {target}  语言选择目标
#   {type}  命令参数类型
#   {updated}  语言更新更改的消息
#   {value}  当前值、默认值或提交的值
#   {variables}  所需的消息变量名称
#   {version}  请求或列出的库插件版本


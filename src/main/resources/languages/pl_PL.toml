# BileTools — pl_PL
#
# === Edycja pliku ===
# plugins/BileTools/languages/pl_PL.toml
# Ten plik można edytować bezpośrednio. Lokalne zmiany są zachowywane; brakujące lub nieprawidłowe wpisy korzystają z wbudowanego angielskiego tekstu.
# /biletools language server edit pl_PL
#
# === Prefiks ===
# Prefiks &a[&8Bile&a]: jest zapisany bezpośrednio w każdej wiadomości; zmień go w odpowiednich wiadomościach.
#
# === Formatowanie ===
# Kolory: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B i [RRGGBB]. MiniMessage pozostaje dostępny dla własnego formatowania.
#
# === Zmienne ===
# Zachowaj nazwy zmiennych i używaj tylko tych, które występują w danej wiadomości.
#   {after}  Wartość po zmianie
#   {argument}  nieoczekiwany argument
#   {before}  Wartość przed zmianą
#   {category}  kategoria
#   {command}  ścieżka polecenia
#   {context}  Powód przeładowania pluginu
#   {count}  Liczba zdalnych celów i wybór formy liczby mnogiej; Liczba wiadomości
#   {file}  Nazwa pliku JAR pluginu
#   {group}  kategoria
#   {host}  Adres IP nadawcy
#   {installedVersion}  Obecnie zainstalowana wersja pluginu
#   {key}  Klucz wiadomości lub parametru
#   {latestVersion}  Najnowsza wersja dostępna w bibliotece
#   {line}  Numer linii źródłowej lub linii
#   {locale}  ustawienia regionalne
#   {maximum}  Maksymalna dopuszczalna wartość
#   {milliseconds}  Czas ładowania, wyładowania lub przeładowania w milisekundach
#   {new}  nowa wartość
#   {old}  poprzednia wartość
#   {parameter}  nazwa parametru
#   {permission}  Wymagane uprawnienie
#   {personal}  osobiste ustawienie regionalne
#   {plugin}  Nazwa wtyczki
#   {reason}  powód błędu
#   {setting}  nazwa ustawienia
#   {target}  Nazwa wtyczki
#   {type}  typ
#   {usage}  użycie polecenia
#   {value}  wartość bieżąca, domyślna lub surowa
#   {variables}  dozwolone symbole zastępcze
#   {version}  Żądana lub wyświetlana wersja pluginu z biblioteki


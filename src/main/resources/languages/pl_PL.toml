# BileTools — pl_PL
#
# === Edycja pliku ===
# plugins/BileTools/languages/pl_PL.toml
# Edytuj ten plik bezpośrednio. Lokalne zmiany są zachowywane; brakujące lub nieprawidłowe wpisy korzystają z wbudowanego tekstu angielskiego.
# /biletools language server edit pl_PL
#
# === Prefiks ===
# Prefiks &a[&8Bile&a]: jest częścią każdego komunikatu na czacie; edytuj go tam.
# Nie ma osobnego ustawienia prefiksu ani zmiennej prefiksu.
#
# === Formatowanie ===
# Kolory i style: &0-&f, &k-&r.
# Kolory RGB: &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B, [RRGGBB].
# MiniMessage obsługuje własne formatowanie. Poprzedź & lub [ ukośnikiem odwrotnym, aby wyświetlić znak dosłownie.
#
# === Zmienne ===
# Nie zmieniaj nazw zmiennych i używaj tylko zmiennych należących do danego komunikatu.
#   {added}  Komunikaty dodane przez aktualizację języka
#   {after}  Wartość komunikatu po edycji
#   {argument}  Nieoczekiwany argument polecenia
#   {before}  Wartość komunikatu przed edycją
#   {capability}  Dostępność wymaganych mechanizmów demontażu
#   {category}  Kategoria edytora konfiguracji
#   {command}  Ścieżka polecenia lub wysłane polecenie
#   {context}  Powód lub wyzwalacz przeładowania wtyczki
#   {cooperative}  Czy wtyczka implementuje kooperacyjne przeładowanie
#   {count}  Liczba skonfigurowanych celów zdalnego wdrażania i wybór formy liczby mnogiej
#   {dependents}  Wtyczki należące do grupy przeładowania
#   {enabled}  Czy sprawdzana wtyczka jest włączona
#   {file}  Nazwa pliku JAR wtyczki
#   {group}  Grupa komunikatów w edytorze języków
#   {host}  Adres IP nadawcy połączenia przychodzącego
#   {installedVersion}  Obecnie zainstalowana wersja wtyczki
#   {kept}  Lokalne edycje zachowane przez aktualizację języka
#   {key}  Klucz parametru polecenia lub komunikatu
#   {latestVersion}  Najnowsza wersja dostępna w bibliotece
#   {line}  Numer wiersza w komunikacie z listą
#   {locale}  Kod języka
#   {maximum}  Maksymalna długość tekstu w edytorze
#   {milliseconds}  Czas wczytywania, wyładowania lub przeładowania w milisekundach
#   {new}  Nowa wartość ustawienia lub komunikatu
#   {old}  Poprzednia wartość ustawienia lub komunikatu
#   {parameter}  Nazwa parametru polecenia
#   {permission}  Wymagany węzeł uprawnień
#   {personal}  Osobisty kod języka, jeśli różni się od domyślnego języka serwera
#   {plugin}  Nazwa wtyczki
#   {reason}  Przyczyna błędu
#   {recovery}  Czy dostępny jest plik JAR do odzyskania uruchomionej wersji
#   {remaining}  Czas do następnego dozwolonego sprawdzenia języków
#   {section}  Sekcja edytora języków
#   {setting}  Nazwa ustawienia lub klucz komunikatu
#   {target}  Cel wyboru języka
#   {type}  Typ parametru polecenia
#   {updated}  Komunikaty zmienione przez aktualizację języka
#   {value}  Bieżąca, domyślna lub wpisana wartość
#   {variables}  Nazwy wymaganych zmiennych komunikatu
#   {version}  Żądana lub wyświetlana wersja wtyczki z biblioteki


# BileTools — zh_TW
#
# === 檔案編輯 ===
# plugins/BileTools/languages/zh_TW.toml
# 可直接編輯此檔案。本機修改會保留；缺少或無效的項目會使用內建英文文字。
# /biletools language server edit zh_TW
#
# === 前綴 ===
# 前綴 &a[&8Bile&a]: 是每則聊天訊息的一部分，請直接在訊息中修改。
# 沒有獨立的前綴設定或前綴佔位符。
#
# === 格式 ===
# 顏色與樣式：&0-&f、&k-&r。
# RGB 顏色：&#RRGGBB、&xRRGGBB、&x&R&R&G&G&B&B、[RRGGBB]。
# MiniMessage 支援自訂格式。在 & 或 [ 前加上反斜線即可原樣顯示。
#
# === 變數 ===
# 請勿變更變數名稱，每則訊息只能使用屬於它的變數。
#   {added}  語言更新新增的訊息
#   {after}  編輯後的訊息值
#   {argument}  非預期的指令引數
#   {before}  編輯前的訊息值
#   {capability}  所需清理能力的可用狀態
#   {category}  設定編輯器分類
#   {command}  指令路徑或送出的指令
#   {context}  外掛重新載入的原因或觸發條件
#   {cooperative}  外掛是否實作協作式重新載入
#   {count}  已設定的遠端部署目標數量及複數選擇值
#   {dependents}  重新載入群組中包含的外掛
#   {enabled}  所檢查的外掛是否已啟用
#   {file}  外掛 JAR 檔案名稱
#   {group}  語言編輯器訊息群組
#   {host}  傳入傳送端的 IP 位址
#   {installedVersion}  目前已安裝的外掛版本
#   {kept}  語言更新保留的本機修改
#   {key}  指令參數鍵或訊息鍵
#   {latestVersion}  程式庫中可用的最新版本
#   {line}  清單訊息中的行號
#   {locale}  語言代碼
#   {maximum}  編輯器輸入的最大長度
#   {milliseconds}  載入、卸載或重新載入的耗時（毫秒）
#   {new}  設定項目或訊息的新值
#   {old}  設定項目或訊息的舊值
#   {parameter}  指令參數名稱
#   {permission}  所需的權限節點
#   {personal}  與伺服器預設值不同時的個人語言代碼
#   {plugin}  外掛名稱
#   {reason}  失敗原因
#   {recovery}  是否有可用於還原目前執行版本的 JAR 檔案
#   {remaining}  距離下次允許檢查語言的時間
#   {section}  語言編輯器區段
#   {setting}  設定項目名稱或訊息鍵
#   {target}  語言選擇目標
#   {type}  指令參數類型
#   {updated}  語言更新變更的訊息
#   {value}  目前值、預設值或送出的值
#   {variables}  所需的訊息變數名稱
#   {version}  請求或列出的程式庫外掛版本


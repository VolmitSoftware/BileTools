# BileTools — zh_TW
#
# === 編輯檔案 ===
# plugins/BileTools/languages/zh_TW.toml
# 可直接編輯此檔案。本機修改會保留；缺少或無效的項目使用內建英文文字。
# /biletools language server edit zh_TW
#
# === 前綴 ===
# 前綴 &a[&8Bile&a]: 直接寫在每則訊息中；請在相應訊息中修改。
#
# === 格式 ===
# 顏色：&0-&f、&k-&r、&#RRGGBB、&xRRGGBB、&x&R&R&G&G&B&B 和 [RRGGBB]。自訂格式仍可使用 MiniMessage。
#
# === 變數 ===
# 請勿變更變數名稱，僅使用各訊息中原有的變數。
#   {after}  變更后的值
#   {argument}  意外引數
#   {before}  變更前的值
#   {category}  編輯器分類
#   {command}  指令路徑
#   {context}  重新載入插件的原因
#   {count}  遠端目標數量及複數形式選擇值; 訊息數量
#   {file}  插件 JAR 檔案名稱
#   {group}  編輯器分類
#   {host}  傳送者的 IP 位址
#   {installedVersion}  目前安裝的插件版本
#   {key}  訊息或參數的鍵
#   {latestVersion}  程式庫中可用的最新版本
#   {line}  來源行或行號
#   {locale}  地區設定
#   {maximum}  最大允許值
#   {milliseconds}  載入、卸載或重新載入的耗時（毫秒）
#   {new}  新值
#   {old}  舊值
#   {parameter}  參數名稱
#   {permission}  所需權限
#   {personal}  個人地區設定
#   {plugin}  插件名稱
#   {reason}  失敗原因
#   {setting}  設定名稱
#   {target}  插件名稱
#   {type}  類型
#   {usage}  指令用法
#   {value}  目前值、預設值或原始值
#   {variables}  可用佔位符
#   {version}  請求或列出的程式庫插件版本


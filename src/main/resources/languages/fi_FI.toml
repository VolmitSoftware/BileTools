# BileTools — fi_FI
#
# === Tiedoston muokkaus ===
# plugins/BileTools/languages/fi_FI.toml
# Muokkaa tätä tiedostoa suoraan. Paikalliset muutokset säilyvät; puuttuvien tai virheellisten kohtien tilalla käytetään sisäänrakennettua englantia.
# /biletools language server edit fi_FI
#
# === Etuliite ===
# Etuliite &a[&8Bile&a]: on osa jokaista chat-viestiä; muokkaa sitä siellä.
# Etuliitteelle ei ole erillistä asetusta eikä muuttujaa.
#
# === Muotoilu ===
# Värit ja tyylit: &0-&f, &k-&r.
# RGB-värit: &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B, [RRGGBB].
# MiniMessage tukee mukautettua muotoilua. Jos haluat näyttää merkin & tai [ sellaisenaan, kirjoita sen eteen kenoviiva.
#
# === Muuttujat ===
# Älä muuta muuttujien nimiä, ja käytä vain kuhunkin viestiin kuuluvia muuttujia.
#   {added}  Kielipäivityksen lisäämät viestit
#   {after}  Viestin arvo muokkauksen jälkeen
#   {argument}  Odottamaton komennon argumentti
#   {before}  Viestin arvo ennen muokkausta
#   {capability}  Tarvittavien purkutoimintojen saatavuus
#   {category}  Asetuseditorin luokka
#   {command}  Komentopolku tai lähetetty komento
#   {context}  Lisäosan uudelleenlatauksen syy tai laukaisija
#   {cooperative}  Tukeeko lisäosa yhteistoiminnallista uudelleenlatausta
#   {count}  Määritettyjen etäkäyttöönoton kohteiden määrä ja monikkomuodon valitsin
#   {dependents}  Uudelleenlatausryhmään kuuluvat lisäosat
#   {enabled}  Onko tarkasteltava lisäosa käytössä
#   {file}  Lisäosan JAR-tiedoston nimi
#   {group}  Kielieditorin viestiryhmä
#   {host}  Saapuvan lähettäjän IP-osoite
#   {installedVersion}  Lisäosan tällä hetkellä asennettu versio
#   {kept}  Kielipäivityksessä säilytetyt paikalliset muokkaukset
#   {key}  Komennon parametrin tai viestin avain
#   {latestVersion}  Kirjaston uusin saatavilla oleva versio
#   {line}  Rivinumero luetteloviestissä
#   {locale}  Kielitunnus
#   {maximum}  Editorin syötteen enimmäispituus
#   {milliseconds}  Lataamisen, muistista poistamisen tai uudelleenlataamisen kesto millisekunteina
#   {new}  Asetuksen tai viestin uusi arvo
#   {old}  Asetuksen tai viestin edellinen arvo
#   {parameter}  Komennon parametrin nimi
#   {permission}  Vaadittu käyttöoikeus
#   {personal}  Oma kielitunnus, jos se eroaa palvelimen oletuksesta
#   {plugin}  Lisäosan nimi
#   {reason}  Virheen syy
#   {recovery}  Onko käynnissä olevan version palautus-JAR saatavilla
#   {remaining}  Aika seuraavaan sallittuun kielitarkistukseen
#   {section}  Kielieditorin osio
#   {setting}  Asetuksen nimi tai viestin avain
#   {target}  Kielivalinnan kohde
#   {type}  Komennon parametrin tyyppi
#   {updated}  Kielipäivityksen muuttamat viestit
#   {value}  Nykyinen, oletus- tai annettu arvo
#   {variables}  Viestin vaatimien muuttujien nimet
#   {version}  Kirjastolisäosan pyydetty tai luettelossa näkyvä versio


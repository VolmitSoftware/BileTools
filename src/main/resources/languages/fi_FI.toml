# BileTools — fi_FI
#
# === Tiedoston muokkaus ===
# plugins/BileTools/languages/fi_FI.toml
# Voit muokata tätä tiedostoa suoraan. Paikalliset muutokset säilyvät; puuttuvat tai virheelliset kohdat käyttävät sisäänrakennettua englantia.
# /biletools language server edit fi_FI
#
# === Etuliite ===
# Etuliite &a[&8Bile&a]: on kirjoitettu suoraan jokaiseen viestiin; muokkaa sitä kyseisissä viesteissä.
#
# === Muotoilu ===
# Värit: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B ja [RRGGBB]. MiniMessage toimii myös omissa muotoiluissa.
#
# === Muuttujat ===
# Säilytä muuttujien nimet ja käytä vain kunkin viestin omia muuttujia.
#   {after}  Arvo muutoksen jälkeen
#   {argument}  odottamaton argumentti
#   {before}  Arvo ennen muutosta
#   {category}  luokka
#   {command}  komentopolku
#   {context}  Lisäosan uudelleenlatauksen syy
#   {count}  Etäkohteiden määrä ja monikkomuodon valitsin; Viestien määrä
#   {file}  Lisäosan JAR-tiedoston nimi
#   {group}  luokka
#   {host}  Lähettäjän IP-osoite
#   {installedVersion}  Lisäosan tällä hetkellä asennettu versio
#   {key}  Viestin tai parametrin avain
#   {latestVersion}  Kirjaston uusin saatavilla oleva versio
#   {line}  Lähderivi tai viivanumero
#   {locale}  kielitunnus
#   {maximum}  Suurin sallittu arvo
#   {milliseconds}  Lataamisen, purkamisen tai uudelleenlataamisen kesto millisekunteina
#   {new}  uusi arvo
#   {old}  edellinen arvo
#   {parameter}  parametrin nimi
#   {permission}  Vaadittu käyttöoikeus
#   {personal}  henkilökohtainen kielitunnus
#   {plugin}  Liitännäisen nimi
#   {reason}  virheen syy
#   {setting}  asetuksen nimi
#   {target}  Liitännäisen nimi
#   {type}  tyyppi
#   {usage}  komennon käyttö
#   {value}  nykyinen, oletus- tai raaka-arvo
#   {variables}  sallitut paikkamerkit
#   {version}  Kirjastolisäosan pyydetty tai näytetty versio


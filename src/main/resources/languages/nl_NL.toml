# BileTools — nl_NL
#
# === Bestand bewerken ===
# plugins/BileTools/languages/nl_NL.toml
# Je kunt dit bestand rechtstreeks bewerken. Lokale wijzigingen blijven behouden; ontbrekende of ongeldige vermeldingen gebruiken het ingebouwde Engels.
# /biletools language server edit nl_NL
#
# === Voorvoegsel ===
# Het voorvoegsel &a[&8Bile&a]: staat rechtstreeks in elk bericht; bewerk het in de betreffende berichten.
#
# === Opmaak ===
# Kleuren: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B en [RRGGBB]. MiniMessage blijft beschikbaar voor eigen opmaak.
#
# === Variabelen ===
# Behoud de namen van variabelen en gebruik alleen de variabelen die bij het bericht horen.
#   {after}  Waarde na de wijziging
#   {argument}  onverwacht argument
#   {before}  Waarde vóór de wijziging
#   {category}  categorie
#   {command}  opdrachtpad
#   {context}  Reden voor het herladen van de plugin
#   {count}  Aantal externe doelen en keuze van de meervoudsvorm; Aantal berichten
#   {file}  Naam van het JAR-bestand van de plugin
#   {group}  categorie
#   {host}  IP-adres van de afzender
#   {installedVersion}  Momenteel geïnstalleerde pluginversie
#   {key}  Bericht- of parametersleutel
#   {latestVersion}  Nieuwste beschikbare versie in de bibliotheek
#   {line}  Bronregel of regelnummer
#   {locale}  landinstelling
#   {maximum}  Maximaal toegestane waarde
#   {milliseconds}  Duur van laden, ontladen of herladen in milliseconden
#   {new}  nieuwe waarde
#   {old}  vorige waarde
#   {parameter}  parameternaam
#   {permission}  Vereiste toestemming
#   {personal}  persoonlijke landinstelling
#   {plugin}  Pluginnaam
#   {reason}  foutreden
#   {section}  Onderdeel van de taaleditor
#   {setting}  instellingsnaam
#   {target}  Pluginnaam
#   {type}  type
#   {value}  huidige, standaard- of ruwe waarde
#   {variables}  geldige tijdelijke aanduidingen
#   {version}  Aangevraagde of getoonde versie van de bibliotheekplugin


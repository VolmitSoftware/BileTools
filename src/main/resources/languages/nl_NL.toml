# BileTools — nl_NL
#
# === Bestand bewerken ===
# plugins/BileTools/languages/nl_NL.toml
# Bewerk dit bestand rechtstreeks. Lokale wijzigingen blijven behouden; ontbrekende of ongeldige vermeldingen gebruiken het ingebouwde Engels.
# /biletools language server edit nl_NL
#
# === Voorvoegsel ===
# Het voorvoegsel &a[&8Bile&a]: maakt deel uit van elk chatbericht; bewerk het daar.
# Er is geen aparte instelling en geen tijdelijke aanduiding voor het voorvoegsel.
#
# === Opmaak ===
# Kleuren en stijlen: &0-&f, &k-&r.
# RGB-kleuren: &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B, [RRGGBB].
# MiniMessage ondersteunt aangepaste opmaak. Zet een backslash vóór & of [ om het teken letterlijk weer te geven.
#
# === Variabelen ===
# Wijzig de namen van variabelen niet en gebruik alleen de variabelen die bij elk bericht horen.
#   {added}  Berichten toegevoegd door een taalupdate
#   {after}  Berichtwaarde na de bewerking
#   {argument}  Onverwacht opdrachtargument
#   {before}  Berichtwaarde vóór de bewerking
#   {capability}  Beschikbaarheid van de vereiste afbraakfuncties
#   {category}  Categorie van de configuratie-editor
#   {command}  Opdrachtpad of ingevoerde opdracht
#   {context}  Reden of aanleiding voor het herladen van een plugin
#   {cooperative}  Of de plugin coöperatief herladen implementeert
#   {count}  Aantal geconfigureerde doelen voor externe uitrol en keuze van de meervoudsvorm
#   {dependents}  Plugins in de herlaadgroep
#   {enabled}  Of de geïnspecteerde plugin is ingeschakeld
#   {file}  Bestandsnaam van de plugin-JAR
#   {group}  Berichtengroep van de taaleditor
#   {host}  IP-adres van de inkomende afzender
#   {installedVersion}  Momenteel geïnstalleerde pluginversie
#   {kept}  Lokale bewerkingen behouden door een taalupdate
#   {key}  Sleutel van de opdrachtparameter of het bericht
#   {latestVersion}  Nieuwste beschikbare bibliotheekversie
#   {line}  Regelnummer binnen een lijstbericht
#   {locale}  Taalcode
#   {maximum}  Maximale invoerlengte in de editor
#   {milliseconds}  Duur van laden, ontladen of herladen in milliseconden
#   {new}  Nieuwe waarde van de instelling of het bericht
#   {old}  Vorige waarde van de instelling of het bericht
#   {parameter}  Naam van de opdrachtparameter
#   {permission}  Vereiste permissienode
#   {personal}  Persoonlijke taalcode als die afwijkt van de serverstandaard
#   {plugin}  Pluginnaam
#   {reason}  Reden van de fout
#   {recovery}  Of er een herstel-JAR van de actieve versie beschikbaar is
#   {remaining}  Tijd tot de volgende taalcontrole is toegestaan
#   {section}  Onderdeel van de taaleditor
#   {setting}  Naam van de instelling of sleutel van het bericht
#   {target}  Doel van de taalkeuze
#   {type}  Type van de opdrachtparameter
#   {updated}  Berichten gewijzigd door een taalupdate
#   {value}  Huidige, standaard- of ingevoerde waarde
#   {variables}  Namen van de vereiste berichtvariabelen
#   {version}  Aangevraagde of vermelde versie van de bibliotheekplugin

